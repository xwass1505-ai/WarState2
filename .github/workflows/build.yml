name: WarState Build

on:
  push:
    paths-ignore:
      - RESTORE_TRIGGER.txt
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: warstate-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Real Rojo 7.7.0 build + tests + ZIP
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare logs
        run: mkdir -p ci_logs

      - name: Download official Rojo 7.7.0
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-all-errors -o rojo-7.7.0-windows-x86_64.zip https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip
          python tools/ci_unpack_rojo.py rojo-7.7.0-windows-x86_64.zip .rojo_bin

      - name: Check Rojo version
        run: |
          set -euo pipefail
          rojo --version 2>&1 | tee ci_logs/rojo_version.txt
          grep -q "7.7.0" ci_logs/rojo_version.txt

      - name: Real Rojo build
        run: |
          set -euo pipefail
          rm -rf build dist WarState_READY_BUILD.zip
          mkdir -p build
          python -c "import time; open('ci_logs/build_start.txt','w').write(str(time.time()))"
          rojo build default.project.json -o build/WarState.rbxlx 2>&1 | tee ci_logs/rojo_build.txt

      - name: Verify build
        run: python tools/verify_build.py build/WarState.rbxlx ci_logs/build_start.txt

      - name: Automated tests
        env:
          WARSTATE_ROJO_BUILD: build/WarState.rbxlx
        run: python -m unittest discover -s tests -t . -v

      - name: Create release ZIP
        run: python tools/make_release_zip.py WarState_READY_BUILD.zip

      - name: Upload release
        uses: actions/upload-artifact@v4
        with:
          name: WarState_READY_BUILD
          path: WarState_READY_BUILD.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci_logs
          path: ci_logs
          retention-days: 14
