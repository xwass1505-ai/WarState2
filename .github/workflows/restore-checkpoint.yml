name: Restore War State v0.4 checkpoint

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download checkpoint
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-all-errors -o /tmp/checkpoint.zip 'https://t90122141309.p.clickup-attachments.com/t90122141309/151fc3be-4be9-4439-9e8f-898d9d64ce15/WarState_v0.4_phase2-6_source_checkpoint.zip?view=open'
          rm -rf /tmp/checkpoint
          mkdir -p /tmp/checkpoint
          unzip -q /tmp/checkpoint.zip -d /tmp/checkpoint
          cp -a /tmp/checkpoint/. .

      - name: Clean generated and obsolete files
        run: |
          set -euo pipefail
          rm -f .github/workflows/restore-v04-wip.yml
          rm -rf build dist ci_logs tests/__pycache__ tools/__pycache__
          rm -f WarState_READY_BUILD.zip WarState_v0.4_WIP_source.zip
          rm -f .github/workflows/build.yml

      - name: Install final CI workflow
        run: |
          set -euo pipefail
          mkdir -p .github/workflows
          cat > .github/workflows/build.yml <<'EOF'
name: WarState Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download official Rojo 7.7.0
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-all-errors -o rojo-7.7.0-windows-x86_64.zip https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip
          python tools/ci_unpack_rojo.py rojo-7.7.0-windows-x86_64.zip .rojo_bin

      - name: Check Rojo version
        run: rojo --version

      - name: Build and verify
        run: |
          set -euo pipefail
          rm -rf build dist ci_logs WarState_READY_BUILD.zip
          mkdir -p build ci_logs
          python -c "import time; open('ci_logs/build_start.txt','w').write(str(time.time()))"
          rojo build default.project.json -o build/WarState.rbxlx
          python tools/verify_build.py build/WarState.rbxlx ci_logs/build_start.txt
          WARSTATE_ROJO_BUILD=build/WarState.rbxlx python -m unittest discover -s tests -t . -v

      - name: Create release ZIP
        run: python tools/make_release_zip.py WarState_READY_BUILD.zip

      - name: Upload release
        uses: actions/upload-artifact@v4
        with:
          name: WarState_READY_BUILD
          path: WarState_READY_BUILD.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci_logs
          path: ci_logs
          retention-days: 14
EOF

      - name: Validate checkpoint source
        run: |
          set -euo pipefail
          python tools/gen_static_map.py --check
          python -m unittest discover -s tests -t . -v

      - name: Commit checkpoint
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/restore-checkpoint.yml
          git add -A
          git commit -m 'Restore complete v0.4 checkpoint [checkpoint-restore]'
          git push origin HEAD:main
