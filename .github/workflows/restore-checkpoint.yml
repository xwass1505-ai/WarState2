name: Restore War State v0.4 checkpoint

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download checkpoint
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-all-errors -o /tmp/checkpoint.zip 'https://t90122141309.p.clickup-attachments.com/t90122141309/151fc3be-4be9-4439-9e8f-898d9d64ce15/WarState_v0.4_phase2-6_source_checkpoint.zip?view=open'
          rm -rf /tmp/checkpoint
          mkdir -p /tmp/checkpoint
          unzip -q /tmp/checkpoint.zip -d /tmp/checkpoint
          cp -a /tmp/checkpoint/. .

      - name: Cleanup checkpoint leftovers
        run: |
          set -euo pipefail
          rm -f .github/workflows/restore-v04-wip.yml
          rm -rf build dist ci_logs
          rm -f WarState_READY_BUILD.zip WarState_v0.4_WIP_source.zip
          rm -rf tests/__pycache__ tools/__pycache__

      - name: Fix build workflow to use official Rojo 7.7.0
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/build.yml')
          s = p.read_text(encoding='utf-8')
          old = '''      - name: Unpack real Rojo 7.7.0 from the repository ZIP
        run: |
          set -euo pipefail
          test -f rojo-7.7.0-windows-x86_64.zip
          python tools/ci_unpack_rojo.py rojo-7.7.0-windows-x86_64.zip .rojo_bin
'''
          new = '''      - name: Download official Rojo 7.7.0
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-all-errors -o rojo-7.7.0-windows-x86_64.zip https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip
          python tools/ci_unpack_rojo.py rojo-7.7.0-windows-x86_64.zip .rojo_bin
'''
          if old in s:
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify source before commit
        run: |
          set -euo pipefail
          python tools/gen_static_map.py --check
          python -m unittest discover -s tests -t . -v

      - name: Remove this restore workflow and commit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/restore-checkpoint.yml
          git add -A
          git commit -m 'Restore complete v0.4 checkpoint [checkpoint-restore]'
          git push origin HEAD:main
