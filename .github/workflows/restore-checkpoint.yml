name: WarState Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: warstate-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Real Rojo 7.7.0 build + tests + ZIP
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare logs
        run: mkdir -p ci_logs

      - name: Download official Rojo 7.7.0
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-all-errors \
            -o rojo-7.7.0-windows-x86_64.zip \
            https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip
          python tools/ci_unpack_rojo.py rojo-7.7.0-windows-x86_64.zip .rojo_bin

      - name: Verify Rojo version
        run: |
          set -euo pipefail
          rojo --version 2>&1 | tee ci_logs/rojo_version.txt
          grep -q "7.7.0" ci_logs/rojo_version.txt

      - name: Remove old build artifacts
        run: |
          rm -rf build dist WarState_READY_BUILD.zip
          mkdir -p build
          python -c "import time; open('ci_logs/build_start.txt','w').write(str(time.time()))"

      - name: REAL Rojo build
        run: |
          set -o pipefail
          rojo build default.project.json -o build/WarState.rbxlx 2>&1 | tee ci_logs/rojo_build.txt
          code=${PIPESTATUS[0]}
          echo "rojo build exit code: $code" | tee -a ci_logs/rojo_build.txt
          exit $code

      - name: Verify build
        run: |
          set -o pipefail
          python tools/verify_build.py build/WarState.rbxlx ci_logs/build_start.txt 2>&1 | tee ci_logs/verify_build.txt

      - name: Automated tests
        env:
          WARSTATE_ROJO_BUILD: build/WarState.rbxlx
        run: |
          set -o pipefail
          python -m unittest discover -s tests -t . -v 2>&1 | tee ci_logs/tests.txt

      - name: Create release ZIP
        run: |
          set -o pipefail
          python tools/make_release_zip.py WarState_READY_BUILD.zip 2>&1 | tee ci_logs/zip.txt

      - name: Upload release
        uses: actions/upload-artifact@v4
        with:
          name: WarState_READY_BUILD
          path: WarState_READY_BUILD.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload CI logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci_logs
          path: ci_logs
          retention-days: 14

      - name: Report summary
        if: always()
        run: |
          {
            echo "## War State CI"
            echo
            echo "- Commit: $GITHUB_SHA"
            echo "- Workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "### Rojo"
            tail -n 5 ci_logs/rojo_version.txt 2>/dev/null || true
            echo
            echo "### Build"
            tail -n 20 ci_logs/rojo_build.txt 2>/dev/null || true
            echo
            echo "### Tests"
            tail -n 40 ci_logs/tests.txt 2>/dev/null || true
            echo
            echo "### ZIP"
            tail -n 10 ci_logs/zip.txt 2>/dev/null || true
          } >> "${GITHUB_STEP_SUMMARY}"
